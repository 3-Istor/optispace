# deploy/values-frontend.yaml
replicaCount: 1

image:
  repository: ghcr.io/3-istor/optispace/frontend
  # Built by the repo's first CI run; Image Updater then writes released versions.
  tag: "sha-4ff8508"

service:
  enabled: true
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 3001

secrets:
  enabled: true
  vaultPath: "project-iot/optispace"
  vaultRole: "iot-optispace-role"

# The backend release creates app-registry; the frontend only references it below.
registrySecret:
  create: false

env:
  # nginx's resolver ignores DNS search domains, so the backend name must be fully
  # qualified. The namespace comes from the pod: staging runs in <ns>-stg with the same Service name.
  - name: POD_NAMESPACE
    valueFrom:
      fieldRef:
        fieldPath: metadata.namespace
  - name: BACKEND_HOST
    value: "http://iot-optispace-backend-cnp-generic-app.$(POD_NAMESPACE).svc.cluster.local:8000"

imagePullSecrets:
  - name: app-registry

project_name: "iot"
app_name: "optispace"

routes:
  optispace:
    auth:
      enabled: true
      realm: "iot"
      vault:
        path: "kvv2/projects/iot/optispace/envoy-auth"
        role: "iot-optispace-role"

ingress:
  enabled: true
  hostname: "optispace-iot.3istor.com"
  sso_protected: false
  realm: "iot"
  # Every project gets its own connector and Gateway in <project>-system now
  # (D-06) — an app-level connector would be a second, redundant one, and the
  # shared Gateway's listeners don't allow routes from a project that now
  # owns its own Gateway.
  tunnel:
    perRelease: false
  gateway:
    name: "iot-gateway"
    namespace: "iot-system"

  allowedGroups: []
auth:
  realm: "iot"
  clientId: "cnp-iot-optispace"

resources:
  requests:
    cpu: "50m"
    memory: "256Mi"
  limits:
    cpu: "250m"
    memory: "256Mi"

release:
  # rolling | canary. Switch from the CMP Release tab, or here.
  strategy: rolling
  preset: safe
  smoke:
    path: "/"

monitoring:
  enabled: true
  path: "/"

offhours:
  enabled: true
  sleepAt: "0 1 * * *"
  wakeAt: "0 7 * * *"
  timezone: "Europe/Paris"
