environment: staging
fullnameOverride: iot-optispace-backend-cnp-generic-app
image:
  repository: ghcr.io/3-istor/optispace/backend
  tag: 1.2.0-rc.1
replicaCount: 1
secrets:
  vaultPath: project-iot/optispace/staging
  vaultRole: iot-optispace-staging-role
db:
  instances: 1
