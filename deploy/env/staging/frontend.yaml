environment: staging
fullnameOverride: iot-optispace-frontend-cnp-generic-app
image:
  repository: ghcr.io/3-istor/optispace/frontend
  tag: 1.2.2-rc.1
replicaCount: 1
secrets:
  vaultPath: project-iot/optispace/staging
  vaultRole: iot-optispace-staging-role
db:
  instances: 1
  backup:
    enabled: false
offhours:
  enabled: true
  sleepAt: 0 23 * * 1-5
  wakeAt: 0 8 * * 1-5
  timezone: Europe/Paris
ingress:
  hostname: optispace-iot-staging.3istor.com
  oidc:
    clientID: cnp-iot-optispace-stg
  realm: iot-staging
  # Swagger without SSO, staging only; API calls from it still need a session.
  publicPaths:
  - path: /api/docs
    method: GET
  - path: /api/openapi.json
    method: GET
auth:
  clientId: cnp-iot-optispace-stg
  realm: iot-staging
