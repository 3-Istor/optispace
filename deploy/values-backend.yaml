# deploy/values-backend.yaml
replicaCount: 1

image:
  repository: ghcr.io/3-istor/optispace/backend
  # Built by the repo's first CI run; Image Updater then writes released versions.
  tag: "sha-4ff8508"

service:
  enabled: true
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000

project_name: "iot"
app_name: "optispace"

secrets:
  enabled: true
  vaultPath: "project-iot/optispace"
  vaultRole: "iot-optispace-role"

imagePullSecrets:
  - name: app-registry

ingress:
  enabled: false

auth:
  realm: "iot"
  clientId: "cnp-iot-optispace"

# deploy/env/staging/backend.yaml replaces this list: report changes there.
env:
  # Issuer of the gateway's JWT, checked by app/security.py.
  - name: OIDC_ISSUER
    value: "https://auth.3istor.com/realms/iot"

resources:
  requests:
    cpu: "50m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "256Mi"

db:
  enabled: true
  name: optispace
  storage: "1Gi"
  storageClass: "local-path"
  backup:
    enabled: true

# The image creates no tables itself (CNP migration standard v1): the platform
# runs its migration entrypoint as a Job once the database is Ready and before
# each new version starts. A failed migration keeps the running version.
migrations:
  enabled: true
  command: ["/app/migrate"]

monitoring:
  enabled: true
  path: "/health"

offhours:
  enabled: true
  sleepAt: "0 1 * * *"
  wakeAt: "0 7 * * *"
  timezone: "Europe/Paris"
